<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Dataframe share image (1200 × 630)</title>
<!-- Source for docs/assets/img/og-image.png. Render at exactly 1200 × 630. See README. -->
<style>
  @font-face { font-family: "Bricolage Grotesque"; src: url("../docs/assets/fonts/bricolage-grotesque-latin.woff2") format("woff2"); font-weight: 200 800; font-stretch: 75% 100%; }
  @font-face { font-family: "Instrument Sans"; src: url("../docs/assets/fonts/instrument-sans-latin.woff2") format("woff2"); font-weight: 400 700; }
  @font-face { font-family: "Fragment Mono"; src: url("../docs/assets/fonts/fragment-mono-latin.woff2") format("woff2"); }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #F2F5F4; color: #0E1B1F;
    font-family: "Instrument Sans", Arial, sans-serif;
  }
  .grid {
    position: absolute; inset: 0 72px;
    border-right: 1px solid #DCE5E3;
    background-image: repeating-linear-gradient(to right, #DCE5E3 0 1px, transparent 1px calc(100% / 12));
  }
  .inner { position: absolute; inset: 64px 72px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand span { font-family: "Bricolage Grotesque"; font-weight: 700; font-stretch: 92%; font-size: 34px; letter-spacing: -.02em; }
  h1 {
    margin: auto 0 0; font-family: "Bricolage Grotesque"; font-weight: 700; font-stretch: 88%;
    font-size: 100px; line-height: .98; letter-spacing: -.022em;
  }
  h1 span { display: block; }
  .sel {
    display: inline-block; position: relative; margin-top: 12px; padding: 2px 14px 6px;
    background: #FDE725; box-shadow: 0 0 0 3px #0E1B1F;
  }
  .sel::after { content: ""; position: absolute; right: -9px; bottom: -9px; width: 14px; height: 14px; background: #0E1B1F; border: 3px solid #F2F5F4; }
  .url { position: absolute; right: 0; top: 7px; margin: 0; font-family: "Fragment Mono", monospace; font-size: 22px; color: #4C5C61; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; display: flex; }
  .bar i { flex: 1; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="inner">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true">
        <rect x="8.5" y="8.5" width="14" height="7" fill="#FDE725"/>
        <rect x="1.5" y="1.5" width="21" height="21" rx="2.5" fill="none" stroke="#0E1B1F" stroke-width="1.6"/>
        <path d="M1.5 8.5h21M1.5 15.5h21M8.5 1.5v21" fill="none" stroke="#0E1B1F" stroke-width="1.6"/>
      </svg>
      <span>Dataframe</span>
    </div>
    <p class="url">dataframe.uk</p>
    <h1><span>Modern data.</span><span>Practical AI.</span><span><span class="sel">Built AI-native.</span></span></h1>
  </div>
  <div class="bar"><i style="background:#414487"></i><i style="background:#2A788E"></i><i style="background:#22A884"></i><i style="background:#7AD151"></i><i style="background:#FDE725"></i></div>
</body>
</html>
